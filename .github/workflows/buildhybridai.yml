name: BuildHybridAI validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: node --experimental-strip-types --test tests/analyze.test.mjs
      - name: TypeScript type check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
